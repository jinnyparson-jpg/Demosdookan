<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOOKAN — Prévisualisation navigable</title><style>
:root{--red:#d90303;--ink:#111;--bg:#f6f7f9;--line:#dbe0e7;--muted:#596579}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.55 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{color:inherit}button,input,select{min-height:44px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:3px}.container{width:min(1240px,calc(100% - 32px));margin:auto}header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.head{display:flex;align-items:center;gap:25px;padding:15px 0}.logo{text-decoration:none;font-weight:950;font-size:28px;letter-spacing:-1px}.logo span,.price{color:var(--red)}.search{flex:1;display:flex;gap:8px;max-width:590px}.search input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:30px;padding:10px 18px}.actions{margin-left:auto;display:flex;gap:20px;align-items:center}.actions a{text-decoration:none;font-weight:650}.badge{background:var(--red);color:white;border-radius:20px;padding:2px 7px;font-size:12px}.cats{display:flex;gap:24px;overflow:auto;border-top:1px solid #eee;padding:12px 0}.cats a{white-space:nowrap;text-decoration:none;font-size:13px}main{padding:28px 0 50px;min-height:65vh}h1{font-size:clamp(28px,4vw,38px);line-height:1.2;margin:0 0 20px}h2{font-size:22px;margin:0 0 15px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 15px}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--red);color:white;text-decoration:none;padding:11px 18px;border:1px solid transparent;border-radius:8px;font-weight:750;min-height:44px}.btn.dark{background:#111}.btn.outline{background:white;color:#111;border-color:var(--line)}.btn.full{width:100%}.btn.sm{font-size:12px;padding:8px 12px}.row{display:flex;align-items:center;gap:12px}.between{display:flex;justify-content:space-between;gap:16px;align-items:center}.wrap{flex-wrap:wrap}.section{margin-top:30px}.panel,.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px #11111106}.panel{padding:24px}.hero{background:#141414;color:white;border-radius:20px;padding:48px;display:grid;grid-template-columns:1.4fr 1fr;gap:35px;align-items:center}.hero h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,58px);margin-top:16px}.hero p{color:#c7ccd3}.hero-offer{background:#222;border:1px solid #414141;border-radius:14px;padding:25px}.tag{display:inline-block;border-radius:6px;padding:4px 9px;background:#eef1f5;color:#344054;font-size:11px;font-weight:750}.tag.red{background:#fff0f0;color:#b00000}.tag.green{background:#e9f8ef;color:#17643b}.tag.orange{background:#fff6dc;color:#815200}.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.category{text-align:center;text-decoration:none;background:white;border:1px solid var(--line);padding:20px 10px;border-radius:12px;font-weight:750}.category svg{display:block;margin:0 auto 10px;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{overflow:hidden;display:flex;flex-direction:column;min-width:0}.art{height:180px;display:flex;align-items:center;justify-content:center;position:relative}.art svg{width:85px;height:105px;color:#596579}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}.art .tag{position:absolute;top:10px;left:10px}.heart{position:absolute;right:8px;top:8px;background:white;border:1px solid var(--line);border-radius:50%;height:36px;min-height:36px;width:36px}.heart svg{width:18px;height:18px}.card-body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.card-body h3{font-size:15px;margin:0}.card-body h3 a{text-decoration:none}.price{font-size:20px;font-weight:900}.card-body .price{margin-top:auto}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:24px}.layout .grid{grid-template-columns:repeat(3,minmax(0,1fr))}.split{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;align-items:start}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:6px;margin-bottom:16px}.field label{font-size:13px;font-weight:750}.control{border:1px solid #bdc5d0;border-radius:7px;background:white;padding:10px 12px;width:100%;min-width:0}textarea.control{min-height:100px}.sum{display:flex;justify-content:space-between;gap:16px;margin:13px 0}.sum.total{border-top:1px solid var(--line);padding-top:17px;font-size:19px;font-weight:900}.line{display:grid;grid-template-columns:65px minmax(0,1fr) auto;gap:15px;padding:20px 0;border-bottom:1px solid var(--line)}.line .art{width:65px;height:80px;border-radius:8px}.line .art svg{width:35px;height:45px}.qty{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-items:center}.qty button{border:0;width:42px;background:#f4f5f7}.qty span{min-width:40px;text-align:center}.notice{background:#eef3ff;color:#243a67;border:1px solid #dbe5ff;padding:13px;border-radius:9px;font-size:13px;margin-bottom:18px}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs a{white-space:nowrap}.steps{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.step{background:white;padding:9px 14px;border:1px solid var(--line);border-radius:30px;font-size:13px}.step.active{background:#111;color:white}.variant{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 15px}.variant.active{border:2px solid var(--red);background:#fff0f0}.big-art{height:390px;border-radius:14px}.big-art svg{width:165px;height:205px}.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.account-grid a{text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{display:block;font-size:25px}.timeline{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.timeline span{padding:8px 10px;background:#e9f8ef;color:#17643b;border-radius:7px;font-size:12px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}.table th{background:#f3f5f7}.overflow{overflow:auto}.empty{text-align:center;padding:45px}.mobile{display:none}footer{background:#111;color:#ddd;padding:30px 0}footer a{color:#ddd}.toast{position:fixed;top:15px;right:15px;background:#111;color:white;padding:15px;border-radius:10px;max-width:calc(100% - 30px);z-index:50;box-shadow:0 8px 30px #0003}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tools a{font-size:12px}.mobile-filter{display:none}dialog{border:0;border-radius:14px;padding:24px;width:min(500px,calc(100% - 24px));max-height:85vh;overflow:auto}dialog::backdrop{background:#0007}.sticky{position:sticky;top:150px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.layout .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr) 300px}}@media(max-width:850px){.head{flex-wrap:wrap;gap:12px}.search{order:3;max-width:none;flex-basis:100%}.hero,.layout,.split{grid-template-columns:1fr}.filters{display:none}.mobile-filter{display:inline-flex}.sticky{position:static}.categories{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}.container{width:calc(100% - 24px)}.hero{padding:24px;gap:20px}.grid,.layout .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card-body{padding:11px}.card-body h3{font-size:13px}.card-body .btn{font-size:12px;padding:9px 7px}.art{height:135px}.art svg{width:65px;height:80px}.price{font-size:17px}.two,.account-grid{grid-template-columns:1fr}.panel{padding:18px}.big-art{height:260px}.line{grid-template-columns:48px minmax(0,1fr)}.line>.price{grid-column:2}.line .art{width:48px;height:65px}.actions a:first-child{display:none}.categories{gap:8px}.category{font-size:12px;padding:15px 6px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:20}.mobile a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;color:var(--muted)}.mobile a.active{color:var(--red);font-weight:800}.tools{gap:6px}.tools .btn{padding:7px 9px}.cats{gap:18px}.cats a{font-size:12px}.head .logo{font-size:25px}}@media(max-width:350px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.stock{align-self:flex-start;line-height:1.3}.stock::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}</style></head><body>

<header><div class="container"><div class="head"><a class="logo" href="#/accueil">DOOKAN<span>.</span></a><form class="search" id="search"><label class="sr" for="q">Rechercher</label><input id="q" placeholder="Produit, marque, référence…"><button class="btn dark" aria-label="Rechercher">⌕</button></form><div class="actions"><a href="#/compte">Mon compte</a><a href="#/panier">Panier <span class="badge" id="count">3</span></a></div></div><nav class="cats" id="cats"></nav></div></header>
<main class="container" id="app" tabindex="-1"></main><footer><div class="container between wrap"><div><a class="logo" href="#/accueil">DOOKAN<span>.</span></a><p class="small">Prévisualisation locale — aucun paiement réel.</p></div><div class="small"><a href="#/professionnel">Espace professionnel</a> · <a href="#/administration">Administration démo</a><p>Les modifications de cette maquette ne sont pas conservées.</p></div></div></footer><nav class="mobile" id="mobile"></nav><dialog id="dialog"></dialog>
<script>
const cats=['Alimentaire','Boissons','Confiseries','Entretien','Hygiène'];
const colors=['#f8edda','#e1effb','#f8e6ed','#e3f2ec','#eee8fb'];
const rows=[['Riz blanc sélection','Madagri',0,'Sac 5 kg',17500,'Sac 25 kg',82000],['Huile de tournesol','HuilMad',0,'Bouteille 1 L',9500,'Carton de 12 × 1 L',108000],['Pâtes alimentaires','Miora',0,'Paquet 500 g',3800],['Sucre blanc','Miora',0,'Sachet 1 kg',4800],['Sauce tomate','Tsiro',0,'Boîte 400 g',3500],['Eau de table','Loharano Démo',1,'Bouteille 1,5 L',2200,'Pack de 6',12000],['Jus de mangue','Voankazo',1,'Brique 1 L',6500,'Carton de 6',36000],['Boisson pétillante','Onja',1,'Bouteille 1 L',4500],['Thé noir','Ravina',1,'Boîte 25 sachets',7200],['Chocolat noir','Kakao Démo',2,'Tablette 100 g',4500],['Biscuits nature','Tsiky',2,'Paquet 200 g',3200],['Bonbons fruités','Tsiky',2,'Sachet 250 g',2800],['Lessive liquide','Clean Démo',3,'Bidon 3 L',24000],['Liquide vaisselle','Clean Démo',3,'Flacon 750 mL',6800],['Nettoyant sols','Madio Démo',3,'Bouteille 1 L',8500],['Éponges ménagères','Madio Démo',3,'Lot de 3',2900],['Savon de toilette','Soa Démo',4,'Pain 100 g',1900],['Dentifrice','Soa Démo',4,'Tube 75 mL',6500],['Shampooing doux','Soa Démo',4,'Flacon 250 mL',12500],['Papier hygiénique','Fotsy Démo',4,'Paquet de 4',7800]];
const ps=rows.map((r,i)=>({id:i,name:r[0],brand:r[1],cat:r[2],variants:[{name:r[3],price:r[4]},...(r[5]?[{name:r[5],price:r[6]}]:[])],stock:i===12?0:i===4?3:20,promo:i===6}));
let cart=[{id:0,v:0,q:1},{id:1,v:0,q:1},{id:9,v:0,q:2}],promo=false,category='all',query='',sort='default',selected={},qty=1,zone='centre',step=1,operator='MVola',scenario='success',orderStatus='confirmée',payment='confirmé',pro=false,favs=new Set();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Math.round(n).toLocaleString('fr-FR')+' Ar';
function icon(type='bag'){let d=type==='home'?'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>':type==='user'?'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>':type==='cart'?'<path d="M3 3h2l3 12h11l3-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/>':type==='grid'?'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>':type==='heart'?'<path d="M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1c-4 5 3 10 8 15 5-5 12-10 8-15Z"/>':type==='bottle'?'<path d="M9 2h6v5l3 5v9H6v-9l3-5V2ZM6 14h12M9 5h6"/>':'<path d="M6 6h12l2 15H4L6 6Z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/>';return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'}
function art(p,cl=''){return `<div class="art ${cl}" style="background:${colors[p.cat]}">${p.id===15?'<span class="small muted">Visuel indisponible</span>':icon(p.cat===1||p.cat===3?'bottle':'bag')}<img src="images/produits/dk-${String(p.id+1).padStart(4,'0')}.jpg" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()"></div>`}
const brands=[...new Set(ps.map(p=>p.brand))].sort((a,b)=>a.localeCompare(b,'fr')),priceRanges=[['lt5','Moins de 5 000 Ar',0,5000],['5-10','5 000 – 9 999 Ar',5000,10000],['10-20','10 000 – 19 999 Ar',10000,20000],['gt20','20 000 Ar et plus',20000,Infinity]],flDef=()=>({brand:'all',price:'all',promo:false});let fl=flDef();
const lvl=p=>!p.stock?'out':p.stock<=5?'low':'in',shownPrice=p=>p.variants[0].price*(p.promo?.92:1);
function setf(el){fl[el.dataset.f]=el.type==='checkbox'?el.checked:el.value}
function stockTag(p){const [c,t]={out:['red','Rupture de stock'],low:['orange','Stock limité · '+p.stock+' restant'+(p.stock>1?'s':'')],in:['green','En stock']}[lvl(p)];return `<span class="tag ${c} stock">${t}</span>`}
function card(p){return `<article class="card"><div style="position:relative"><a href="#/produit/${p.id}" tabindex="-1">${art(p)}</a><span class="tag ${p.promo?'red':''}" style="position:absolute;top:9px;left:9px">${!p.stock?'Épuisé':p.promo?'−8 %':'Démo'}</span><button class="heart" data-action="fav" data-id="${p.id}" aria-label="Favori" aria-pressed="${favs.has(p.id)}">${icon('heart')}</button></div><div class="card-body"><span class="tiny muted">${esc(p.brand)} · DK-${String(p.id+1).padStart(4,'0')}</span><h3><a href="#/produit/${p.id}">${esc(p.name)}</a></h3><span class="small muted">${esc(p.variants[0].name)}</span><div class="price">${money(p.variants[0].price*(p.promo?.92:1))}</div><span class="tiny muted">Prix / ${esc(p.variants[0].name)}</span>${stockTag(p)}<button class="btn full ${p.variants.length>1?'dark':''}" data-action="${p.variants.length>1?'choose':'add'}" data-id="${p.id}" ${!p.stock?'disabled':''}>${p.variants.length>1?'Choisir le format':'Ajouter'}</button></div></article>`}
function grid(items){return `<div class="grid">${items.map(card).join('')}</div>`}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3000)}
function nav(){const page=(location.hash.split('/')[1]||'accueil');$('#count').textContent=cart.reduce((s,l)=>s+l.q,0);$('#mobile').innerHTML=[['accueil','home','Accueil'],['catalogue','grid','Catalogue'],['panier','cart','Panier'],['compte','user','Compte']].map(([r,i,t])=>`<a href="#/${r}" class="${r===page?'active':''}">${icon(i)}${t}</a>`).join('')}
function total(){const subtotal=cart.reduce((s,l)=>s+ps[l.id].variants[l.v].price*l.q,0),discount=promo&&subtotal>=30000?Math.min(15000,Math.round(subtotal*.1)):0,fee=zone==='pickup'?0:zone==='peripherie'?9000:5000;return {subtotal,discount,fee,total:subtotal-discount+fee}}
function summary(link=true){const t=total();return `<h2>Récapitulatif</h2><div class="sum"><span>Sous-total</span><strong>${money(t.subtotal)}</strong></div><div class="sum"><span>Réduction produits</span><span>− ${money(t.discount)}</span></div><div class="sum"><span>Livraison simulée</span><span>${money(t.fee)}</span></div><div class="sum total"><span>Total à payer</span><span>${money(t.total)}</span></div><p class="tiny muted">Montants fictifs. Aucun paiement ni livraison réels.</p>${link?'<a class="btn full" href="#/commande">Passer commande</a>':''}`}
function home(){return `<div class="between wrap small" style="margin-bottom:18px"><span class="muted">Livraison : adresse à sélectionner</span><a href="#/aide">À propos de cette prévisualisation</a></div><section class="hero"><div><span class="tag red">À l’unité ou en conditionnement</span><h1>Vos achats du quotidien, simplement.</h1><p>Explorez le catalogue de démonstration et découvrez les parcours particulier et professionnel.</p><a class="btn" href="#/catalogue">Découvrir les produits</a></div><div class="hero-offer"><h2>Votre première sélection</h2><p>Code fictif <strong>BIENVENUE10</strong> : −10 % dès 30 000 Ar, remise plafonnée à 15 000 Ar.</p><button class="btn outline" data-action="code">Afficher le code</button></div></section><section class="section"><h2>Nouveautés</h2>${grid(ps.slice(-4))}</section><section class="section"><h2>Offres du moment</h2>${grid(ps.filter(p=>p.promo))}</section><section class="section"><div class="between"><h2>Notre sélection</h2><a href="#/catalogue">Tout voir</a></div>${grid(ps)}</section><section class="section panel between wrap"><div><h2>Vous achetez pour votre commerce ?</h2><p class="muted">Tarifs professionnels et demandes de devis de démonstration.</p></div><a class="btn dark" href="#/professionnel">Espace professionnel</a></section>`}
function filters(){return `<h3>Filtres</h3><div class="field"><label><input type="checkbox" id="available"> Disponible uniquement</label></div><div class="field"><label>Marque</label><select class="control" aria-label="Marque" data-f="brand"><option value="all">Toutes</option>${brands.map(b=>`<option value="${esc(b)}" ${fl.brand===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div><div class="field"><label>Prix</label><select class="control" aria-label="Prix" data-f="price"><option value="all">Tous les prix</option>${priceRanges.map(([v,t])=>`<option value="${v}" ${fl.price===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label><input type="checkbox" data-f="promo" ${fl.promo?'checked':''}> En promotion uniquement</label></div><div class="field"><label>Conditionnement</label><select class="control"><option>Tous</option><option>Unité</option><option>Carton</option><option>Pack</option></select></div><p class="tiny muted">Les filtres avancés sont illustratifs dans cette prévisualisation.</p><button class="btn outline full" data-action="reset">Réinitialiser</button>`}
function catalog(){return `<h1>Catalogue</h1><div class="layout"><aside class="panel filters">${filters()}</aside><div><div class="between wrap"><button class="btn outline mobile-filter" data-action="filters">Filtrer</button><p class="small muted" id="results-count"></p><select class="control" id="sort" style="width:auto"><option value="default">Pertinence</option><option value="asc" ${sort==='asc'?'selected':''}>Prix croissant</option><option value="desc" ${sort==='desc'?'selected':''}>Prix décroissant</option></select></div><p class="tiny muted">Prix du premier conditionnement affiché. Les cartons et unités ne sont pas équivalents.</p><div id="results"></div></div></div>`}
function results(){let items=ps.filter(p=>(category==='all'||p.cat===Number(category))&&(!query||[p.name,p.brand,'DK-'+String(p.id+1).padStart(4,'0')].join(' ').toLowerCase().includes(query.toLowerCase())));if($('#available')?.checked)items=items.filter(p=>p.stock);items=items.filter(p=>(fl.brand==='all'||p.brand===fl.brand)&&(fl.price==='all'||(r=>shownPrice(p)>=r[2]&&shownPrice(p)<r[3])(priceRanges.find(r=>r[0]===fl.price)))&&(!fl.promo||p.promo));if(sort!=='default')items.sort((a,b)=>(a.variants[0].price-b.variants[0].price)*(sort==='desc'?-1:1));$('#results-count').textContent=items.length+' produit(s)'+(query?' · '+query:'');$('#results').innerHTML=items.length?grid(items):'<div class="panel empty"><h2>Aucun résultat</h2><button class="btn" data-action="reset">Réinitialiser</button></div>'}
function detail(id){const p=ps[id];if(!p)return '<h1>Produit introuvable</h1>';const v=selected[id]||0;return `<a href="#/catalogue">← Retour au catalogue</a><div class="panel two section">${art(p,'big-art')}<div><span class="tag">${cats[p.cat]}</span><h1 style="margin-top:12px">${p.name}</h1><p class="small muted">${p.brand} · DK-${String(id+1).padStart(4,'0')}</p><p>Produit fictif pour présenter le catalogue et les parcours Dookan.</p><h3>Choisir le conditionnement</h3><div class="row wrap">${p.variants.map((x,i)=>`<button class="variant ${i===v?'active':''}" data-action="variant" data-id="${id}" data-v="${i}">${x.name}</button>`).join('')}</div><p class="price section">${money(p.variants[v].price)} / ${p.variants[v].name}</p><p style="margin-bottom:6px">${stockTag(p)}</p><p class="small muted">${p.stock?p.stock+' disponible(s)':'Produit épuisé'}</p><div class="row wrap"><span>Quantité</span><div class="qty"><button data-action="detailminus">−</button><span id="detailqty">${qty}</span><button data-action="detailplus">+</button></div></div><p class="section">Montant : <strong id="detailtotal">${money(p.variants[v].price*qty)}</strong></p><button class="btn full" data-action="adddetail" data-id="${id}" ${!p.stock?'disabled':''}>Ajouter au panier</button><details class="section"><summary>Informations et livraison</summary><p class="small muted">Visuels, informations et livraison de démonstration. Aucun service réel n’est engagé.</p></details></div></div><section class="section"><h2>Dans la même catégorie</h2>${grid(ps.filter(x=>x.cat===p.cat&&x.id!==id).slice(0,4))}</section>`}
function basket(){return `<h1>Votre panier</h1><p class="muted small">${new Set(cart.map(x=>x.id)).size} références distinctes · ${cart.length} lignes · quantités par conditionnement</p>${!cart.length?'<div class="panel empty"><h2>Votre panier est vide</h2><a class="btn" href="#/catalogue">Voir le catalogue</a></div>':`<div class="split"><div class="panel">${cart.map((l,i)=>{const p=ps[l.id],v=p.variants[l.v];return `<article class="line">${art(p)}<div><h3>${p.name}</h3><p class="small muted">${v.name} · ${money(v.price)} / conditionnement</p><div class="row wrap"><div class="qty"><button data-action="minus" data-index="${i}">−</button><span>${l.q}</span><button data-action="plus" data-index="${i}">+</button></div><button class="btn outline sm" data-action="remove" data-index="${i}">Supprimer</button></div></div><strong class="price">${money(v.price*l.q)}</strong></article>`}).join('')}</div><aside class="panel sticky"><details ${promo?'open':''}><summary>Vous avez un code promo ?</summary><form id="promo" class="section"><div class="field"><label for="promocode">Code</label><input class="control" id="promocode" placeholder="BIENVENUE10"></div><button class="btn sm">Appliquer</button></form>${promo?'<p class="small section">BIENVENUE10 actif</p>':''}</details><div class="section">${summary()}</div></aside></div>`}`}
function checkout(){return `<h1>Finaliser ma commande</h1><div class="steps"><span class="step ${step===1?'active':''}">1. Livraison</span><span class="step ${step===2?'active':''}">2. Vérification et paiement</span><span class="step">3. Résultat</span></div><div class="split"><section class="panel">${step===1?`<h2>Coordonnées et livraison</h2><p class="small muted">Exemples fictifs préremplis pour explorer l’interface.</p><form id="delivery"><div class="two"><div class="field"><label>Nom complet</label><input class="control" value="Client de démonstration" required></div><div class="field"><label>Téléphone</label><input class="control" type="tel" value="034 00 000 00" required></div></div><div class="field"><label>Mode de réception et zone</label><select class="control" id="zone"><option value="centre">Livraison zone centrale — 5 000 Ar</option><option value="peripherie" ${zone==='peripherie'?'selected':''}>Livraison zone périphérique — 9 000 Ar</option><option value="pickup" ${zone==='pickup'?'selected':''}>Retrait simulé — gratuit</option><option value="outside">Hors zone — non desservie</option></select></div><div class="field"><label>Adresse</label><input class="control" value="Adresse de démonstration" required></div><div class="two"><div class="field"><label>Quartier</label><input class="control" value="Antananarivo"></div><div class="field"><label>Point de repère</label><input class="control" placeholder="Facultatif"></div></div><div class="field"><label>Instructions facultatives</label><textarea class="control"></textarea></div><button class="btn full">Vérifier ma commande</button></form>`:`<h2>Vérifier avant de payer</h2><div class="between"><strong>Coordonnées et réception</strong><button class="btn outline sm" data-action="back">Modifier</button></div><p class="small section">Client de démonstration · 034 00 000 00<br>Adresse de démonstration — Antananarivo</p>${cart.map(l=>`<div class="sum small"><span>${ps[l.id].name}<br><span class="muted">${ps[l.id].variants[l.v].name} × ${l.q}</span></span><strong>${money(ps[l.id].variants[l.v].price*l.q)}</strong></div>`).join('')}<h2 class="section">Paiement Mobile Money simulé</h2><div class="notice">Aucun opérateur n’est contacté. Ne saisissez aucun PIN, OTP ou mot de passe.</div><form id="payment"><div class="row wrap">${['MVola','Orange Money','Airtel Money'].map(o=>`<label class="panel small" style="padding:10px"><input type="radio" name="operator" value="${o}" ${operator===o?'checked':''}> ${o}</label>`).join('')}</div><div class="field section"><label>Numéro du payeur</label><input class="control" value="034 00 000 00" type="tel" required></div><div class="field"><label>Scénario de démonstration</label><select class="control" id="scenario"><option value="success">Succès</option><option value="pending">En attente</option><option value="failed">Échec</option><option value="expired">Expiration</option></select></div><label class="small"><input type="checkbox" required> Je comprends qu’aucun paiement réel ne sera effectué.</label><button class="btn full section">Simuler le paiement de ${money(total().total)}</button></form>`}</section><aside class="panel sticky">${summary(false)}<a href="#/panier">Modifier le panier</a></aside></div>`}
function confirmation(){return `<section class="panel" style="max-width:680px;margin:auto"><span class="tag ${payment==='confirmé'?'green':'orange'}">Paiement : ${payment}</span><h1 class="section">${payment==='confirmé'?'Votre commande est confirmée':payment==='en attente'?'Paiement en attente':payment==='expiré'?'Le paiement simulé a expiré':'Le paiement simulé a échoué'}</h1><p>Commande <strong>DK-DEMO-001</strong> · ${money(total().total)}</p><p class="muted">Aucun argent n’a été encaissé. Il s’agit d’un écran de démonstration.</p><div class="row wrap"><a class="btn" href="#/suivi">Voir la commande</a><a class="btn outline" href="#/catalogue">Continuer mes achats</a></div></section>`}
function tracking(){return `<a href="#/commandes">← Mes commandes</a><h1 class="section">DK-DEMO-001</h1><div class="split"><div class="panel"><span class="tag">Commande : ${orderStatus}</span> <span class="tag green">Paiement : ${payment}</span><div class="timeline">${['reçue','confirmée','en préparation','expédiée','livrée'].map(s=>`<span>${s}</span>`).join('')}</div><h2>Articles commandés</h2>${cart.map(l=>`<div class="sum"><span>${ps[l.id].name}<br><span class="small muted">${ps[l.id].variants[l.v].name} × ${l.q}</span></span><strong>${money(ps[l.id].variants[l.v].price*l.q)}</strong></div>`).join('')}<h2 class="section">Réception</h2><p>Client de démonstration<br>Adresse fictive — Antananarivo</p><div class="row wrap"><a class="btn outline" href="#/panier">Commander à nouveau</a><button class="btn outline" data-action="claim">Signaler un problème</button>${payment!=='confirmé'?'<a class="btn" href="#/commande" data-action="payagain">Reprendre le paiement</a>':''}</div><h2 class="section">Documents de démonstration</h2><button class="btn outline" data-action="doc">Voir le document</button><h2 class="section">Tentatives de paiement</h2><p class="small">TX-DEMO-001 · ${operator} · ${payment}<br><span class="muted">Transaction fictive</span></p></div><aside class="panel">${summary(false)}</aside></div>`}
function orders(){return `<h1>Mes commandes</h1><div class="panel"><div class="between wrap"><div><a href="#/suivi"><strong>DK-DEMO-001</strong></a><p class="small muted">Commande d’exemple pour explorer le suivi.</p><span class="tag">${orderStatus}</span> <span class="tag green">Paiement : ${payment}</span></div><div><strong class="price">${money(total().total)}</strong><p><a href="#/suivi">Voir le détail</a></p></div></div></div>`}
function account(){return `<h1>Mon compte de démonstration</h1><div class="notice">Aucune authentification sécurisée. Les changements de cette prévisualisation sont temporaires.</div><div class="panel between wrap section"><div><h2>Client de démonstration</h2><p class="muted">${pro?'Professionnel validé — démo':'Particulier'}</p></div><button class="btn outline" data-action="profile">Modifier le profil</button></div><div class="account-grid section">${[['commandes','Mes commandes','Suivi, réachat et assistance'],['adresses','Mes adresses','Adresses enregistrées'],['favoris','Mes favoris','Retrouver vos produits'],['professionnel','Espace professionnel','Tarifs et devis de démonstration'],['aide','Aide et conditions','Comprendre les règles fictives']].map(([r,t,d])=>`<a class="panel" href="#/${r}">${icon(r==='favoris'?'heart':'user')}<h2 class="section">${t}</h2><p class="small muted">${d}</p></a>`).join('')}</div>`}
function professional(){return `<h1>Espace professionnel</h1><div class="notice">Conditions et tarifs fictifs. Aucun crédit client n’est proposé.</div><div class="panel section">${!pro?`<h2>Demander un accès professionnel</h2><p class="muted">Ne transmettez aucun document sensible.</p><form id="pro"><div class="field"><label>Nom de l’entreprise</label><input class="control" placeholder="Votre entreprise" required></div><div class="field"><label>Nom du contact</label><input class="control" value="Client de démonstration" required></div><div class="field"><label>Téléphone</label><input class="control" type="tel" placeholder="Numéro de démonstration" required></div><div class="field"><label>Type d’activité</label><select class="control"><option>Commerce</option><option>Restauration</option><option>Autre activité</option></select></div><button class="btn">Découvrir le compte professionnel démo</button></form>`:`<span class="tag green">Professionnel validé — démo</span><h2 class="section">Commander pour votre commerce</h2><p class="muted">Illustration des tarifs par quantité : −3 %, −5 % dès 5 conditionnements, −8 % dès 10. Non appliqués aux calculs de cette maquette simplifiée.</p><div class="two"><div class="field"><label>Commande rapide par référence</label><select class="control" id="quick">${ps.map(p=>`<option value="${p.id}">DK-${String(p.id+1).padStart(4,'0')} — ${p.name}</option>`).join('')}</select></div><div class="field"><label>Quantité</label><input class="control" id="quickqty" type="number" min="2" value="2"></div></div><button class="btn" data-action="quick">Ajouter au panier</button><h2 class="section">Demander un devis</h2><form id="quote"><div class="field"><label>Produits, références et quantités souhaités</label><textarea class="control" required placeholder="Ex. DK-0002 — 10 cartons…"></textarea></div><button class="btn outline">Envoyer la demande fictive</button></form>`}</div>`}
function admin(tab='dashboard'){const tabs=[['dashboard','À traiter'],['orders','Commandes'],['payments','Paiements'],['products','Catalogue / stocks'],['promos','Promotions'],['clients','Professionnels / devis'],['claims','Réclamations'],['logs','Journal']];let content='';if(tab==='dashboard')content=`<div class="metrics">${[['Commandes non annulées','1'],['Montant commandé',money(total().total)],['Paiements confirmés',payment==='confirmé'?money(total().total):'0 Ar'],['Encaissement net simulé',payment==='confirmé'?money(total().total):'0 Ar']].map(([t,v])=>`<div class="panel metric"><span class="small muted">${t}</span><strong>${v}</strong></div>`).join('')}</div><p class="tiny muted section">Indicateurs illustratifs basés sur la commande d’exemple. Aucun encaissement réel.</p><div class="two section"><div class="panel"><h2>À traiter</h2><p>1 commande d’exemple</p><p>${payment==='en attente'?1:0} paiement en attente</p><p>2 variantes en stock faible</p><a class="btn outline" href="#/administration/orders">Voir les commandes</a></div><div class="panel"><h2>Indicateurs commerciaux</h2><p>Remboursements simulés : 0 Ar</p><p>Panier moyen : ${money(total().total)}</p><h3>Produits commandés</h3>${cart.map(l=>`<p class="small">${ps[l.id].name} : ${l.q} conditionnement(s)</p>`).join('')}</div></div>`;else if(tab==='orders'||tab==='payments')content=`<div class="panel"><div class="between wrap"><div><a href="#/suivi"><strong>DK-DEMO-001</strong></a><p>Client de démonstration · ${money(total().total)}</p></div><span class="tag">${orderStatus}</span></div><p class="small">Paiement : ${payment}</p><div class="row wrap"><button class="btn" data-action="advance">Faire avancer le statut</button><button class="btn outline" data-action="refund">Remboursement simulé</button></div></div>`;else if(tab==='products')content=`<div class="panel"><h2>Catalogue et disponibilités</h2><div class="overflow"><table class="table"><thead><tr><th>Produit</th><th>Conditionnement</th><th>Prix public</th><th>Stock</th><th>Action</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.name}<br><span class="tiny muted">DK-${String(p.id+1).padStart(4,'0')}</span></td><td>${p.variants[0].name}</td><td>${money(p.variants[0].price)}</td><td>${p.stock}</td><td><button class="btn outline sm" data-action="stock" data-id="${p.id}">Modifier</button></td></tr>`).join('')}</tbody></table></div></div>`;else if(tab==='promos')content=`<div class="panel"><h2>Codes promotionnels</h2>${[['BIENVENUE10','−10 % dès 30 000 Ar, plafond 15 000 Ar'],['LIVRAISON0','Livraison offerte, zone centrale — illustration'],['EXPIRE','Code volontairement expiré']].map(([c,t])=>`<div class="section"><strong>${c}</strong> <span class="tag">Démo</span><p class="small">${t}</p><button class="btn outline sm" data-action="promoedit">Modifier</button></div>`).join('')}</div>`;else if(tab==='clients')content=`<div class="panel"><h2>Compte professionnel</h2><p>Client de démonstration · ${pro?'validé':'particulier'}</p><button class="btn" data-action="validatepro">Valider le compte de démonstration</button><h2 class="section">Devis</h2><p class="muted">Les demandes fictives peuvent être explorées depuis l’espace professionnel.</p><a class="btn outline" href="#/professionnel">Voir l’espace professionnel</a></div>`;else if(tab==='claims')content=`<div class="panel"><h2>Réclamations et retours</h2><p class="muted">Exemple de demande après-vente.</p><div class="notice"><strong>Produit endommagé — en cours</strong><p>Commande DK-DEMO-001 · Merci de vérifier un article de démonstration.</p></div><button class="btn outline" data-action="claimresponse">Traiter la demande</button></div>`;else content='<div class="panel"><h2>Journal local de démonstration</h2><p class="small muted">Cette prévisualisation présente les écrans, sans journal commercial persistant.</p></div>';return `<h1>Administration démo</h1><div class="notice">Accès non sécurisé — prévisualisation uniquement. Ne pas utiliser en production.</div><nav class="tabs">${tabs.map(([r,t])=>`<a class="btn ${tab===r?'dark':'outline'} sm" href="#/administration/${r}">${t}</a>`).join('')}</nav>${content}`}
function modal(title,body){$('#dialog').innerHTML=`<div class="between"><h2>${esc(title)}</h2><button class="btn outline sm" data-action="close">Fermer</button></div>${body}`;$('#dialog').showModal()}
function route(){const [page='accueil',id]=location.hash.replace('#/','').split('/');let h='';if(page==='accueil')h=home();else if(page==='catalogue')h=catalog();else if(page==='produit')h=detail(Number(id));else if(page==='panier')h=basket();else if(page==='commande')h=checkout();else if(page==='confirmation')h=confirmation();else if(page==='suivi')h=tracking();else if(page==='commandes')h=orders();else if(page==='compte')h=account();else if(page==='professionnel')h=professional();else if(page==='administration')h=admin(id);else if(page==='favoris')h='<h1>Mes favoris</h1>'+(!favs.size?'<div class="panel empty">Ajoutez un favori depuis une carte produit.</div>':grid(ps.filter(p=>favs.has(p.id))));else if(page==='adresses')h='<h1>Mes adresses</h1><div class="panel"><h2>Adresse de démonstration</h2><p>Client de démonstration<br>Antananarivo — adresse fictive</p><a class="btn outline" href="#/commande">Utiliser pendant une commande</a></div>';else h='<h1>À propos de cette prévisualisation</h1><div class="panel"><h2>Une maquette interactive</h2><p>Ce fichier permet de visualiser les principaux écrans du projet précédent et leurs adaptations mobile et ordinateur.</p><p>Il ne constitue pas une exécution du code complet : les traitements avancés de stock, réservation, remboursement, devis, permissions et persistance sont simplifiés ou illustratifs.</p><p>Le panier, les catégories, les formats, le parcours de paiement et quelques actions administratives peuvent être explorés sans connexion réseau.</p><a class="btn" href="#/accueil">Retour à l’accueil</a></div>';$('#app').innerHTML=h;nav();if(page==='catalogue')results();window.scrollTo(0,0)}
function add(id,v=0,q=1){const p=ps[id];if(!p.stock)return toast('Produit épuisé.');let l=cart.find(x=>x.id===id&&x.v===v);if(l)l.q=Math.min(p.stock,l.q+q);else cart.push({id,v,q:Math.min(p.stock,q)});nav();toast('Article ajouté au panier de prévisualisation.')}
$('#cats').innerHTML='<a href="#/accueil"><strong>Accueil</strong></a>'+cats.map((c,i)=>`<a href="#/catalogue" data-cat="${i}">${c}</a>`).join('');
document.addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){e.preventDefault();category=c.dataset.cat;query='';if(location.hash==='#/catalogue')route();else location.hash='#/catalogue';return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=Number(b.dataset.id),i=Number(b.dataset.index);if(a==='choose')location.hash='#/produit/'+id;if(a==='add')add(id);if(a==='adddetail')add(id,selected[id]||0,qty);if(a==='variant'){selected[id]=Number(b.dataset.v);qty=1;route()}if(a==='detailminus'||a==='detailplus'){qty=Math.max(1,Math.min(ps[Number(location.hash.split('/')[2])].stock,qty+(a==='detailplus'?1:-1)));$('#detailqty').textContent=qty;const p=ps[Number(location.hash.split('/')[2])];$('#detailtotal').textContent=money(p.variants[selected[p.id]||0].price*qty)}if(a==='fav'){favs.has(id)?favs.delete(id):favs.add(id);b.setAttribute('aria-pressed',favs.has(id));toast(favs.has(id)?'Favori ajouté.':'Favori retiré.')}if(a==='code')toast('Code à saisir : BIENVENUE10');if(a==='plus'||a==='minus'){cart[i].q=Math.max(1,Math.min(ps[cart[i].id].stock,cart[i].q+(a==='plus'?1:-1)));route()}if(a==='remove'){cart.splice(i,1);route()}if(a==='reset'){category='all';query='';sort='default';fl=flDef();$('#q').value='';if($('#dialog').open)$('#dialog').close();route()}if(a==='filters')modal('Filtres du catalogue',filters()+'<button class="btn full section" data-action="applyfilters">Voir les résultats</button>');if(a==='applyfilters'){document.querySelectorAll('#dialog [data-f]').forEach(setf);$('#dialog').close();route()}if(a==='back'){step=1;route()}if(a==='payagain')step=2;if(a==='close')$('#dialog').close();if(a==='claim')modal('Signaler un problème / demander un retour','<form id="claim"><div class="field"><label>Type de demande</label><select class="control"><option>Article manquant</option><option>Produit endommagé</option><option>Retour</option><option>Annulation</option></select></div><div class="field"><label>Description</label><textarea class="control" required></textarea></div><p class="small muted">Aucun remboursement automatique. Formulaire de présentation.</p><button class="btn">Envoyer la demande fictive</button></form>');if(a==='doc')modal('Document de démonstration','<p><strong>SANS VALEUR FISCALE</strong></p><p>DOOKAN · DK-DEMO-001</p>'+cart.map(l=>`<p class="small">${ps[l.id].name} · ${l.q} × ${money(ps[l.id].variants[l.v].price)}</p>`).join('')+`<h3>Total : ${money(total().total)}</h3><p class="small muted">Aucun paiement réel.</p>`);if(a==='profile')modal('Modifier le profil','<form id="profile"><div class="field"><label>Nom</label><input class="control" value="Client de démonstration" required></div><div class="field"><label>Téléphone</label><input class="control" type="tel" placeholder="Facultatif"></div><button class="btn">Enregistrer dans la maquette</button></form>');if(a==='quick')add(Number($('#quick').value),0,Math.max(2,Number($('#quickqty').value)));if(a==='advance'){const stages=['confirmée','en préparation','expédiée','livrée'];orderStatus=stages[Math.min(3,stages.indexOf(orderStatus)+1)];route();toast('Statut illustratif : '+orderStatus)}if(a==='refund')modal('Remboursement simulé','<form id="refund"><p>Aucun transfert réel.</p><div class="field"><label>Montant fictif (Ar)</label><input class="control" type="number" min="1" max="'+total().total+'" value="'+total().total+'" required></div><button class="btn">Confirmer la simulation</button></form>');if(a==='stock')modal('Modifier la disponibilité','<form id="stock" data-id="'+id+'"><p>'+ps[id].name+'</p><div class="field"><label>Stock disponible fictif</label><input class="control" id="stockvalue" type="number" min="0" value="'+ps[id].stock+'" required></div><button class="btn">Enregistrer</button></form>');if(a==='validatepro'){pro=true;route();toast('Compte professionnel de démonstration activé.')}if(a==='promoedit')modal('Promotion — présentation','<div class="field"><label>Code</label><input class="control" value="BIENVENUE10"></div><div class="field"><label>Remise (%)</label><input class="control" type="number" value="10"></div><p class="small muted">L’édition des règles n’est pas appliquée aux calculs de cette prévisualisation.</p><button class="btn" data-action="close">Fermer</button>');if(a==='claimresponse')modal('Traiter la demande','<form id="claimresponse"><div class="field"><label>Décision fictive</label><select class="control"><option>Acceptée</option><option>Refusée</option></select></div><div class="field"><label>Réponse</label><textarea class="control" required></textarea></div><button class="btn">Enregistrer la réponse fictive</button></form>')});
document.addEventListener('change',e=>{if(e.target.dataset.f&&!$('#dialog').open){setf(e.target);results()}if(e.target.id==='category'&&!$('#dialog').open){category=e.target.value;results()}if(e.target.id==='sort'){sort=e.target.value;results()}if(e.target.id==='available'&&!$('#dialog').open)results()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='search'){query=$('#q').value.trim();if(location.hash==='#/catalogue')results();else location.hash='#/catalogue'}else if(f.id==='promo'){if($('#promocode').value.trim().toUpperCase()==='BIENVENUE10'){promo=true;route();toast(total().subtotal>=30000?'Code appliqué.':'Minimum requis : 30 000 Ar.')}else toast('Code invalide dans cette prévisualisation.')}else if(f.id==='delivery'){if($('#zone').value==='outside')return toast('Zone non desservie : choisissez une autre zone ou le retrait.');zone=$('#zone').value;step=2;route()}else if(f.id==='payment'){operator=new FormData(f).get('operator');scenario=$('#scenario').value;payment={success:'confirmé',pending:'en attente',failed:'échoué',expired:'expiré'}[scenario];orderStatus=scenario==='success'?'confirmée':'reçue';location.hash='#/confirmation'}else if(f.id==='pro'){pro=true;route()}else if(f.id==='quote'){toast('Demande de devis fictive envoyée.');f.reset()}else if(f.id==='stock'){ps[Number(f.dataset.id)].stock=Math.max(0,Math.trunc(Number($('#stockvalue').value)));$('#dialog').close();route()}else {if($('#dialog').open)$('#dialog').close();toast('Action de démonstration enregistrée temporairement.')}});
window.addEventListener('hashchange',route);if(!location.hash)location.hash='#/accueil';else route();
</script></body></html>
